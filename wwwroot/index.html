<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ERP_PAYROLLMOBILE</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/app-tokens.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="ERP_PAYROLLMOBILE.styles.css" />
    <link rel="stylesheet" href="css/mobile-typography.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="app-startup-loading" data-app-startup>
            <strong>Đang tải ứng dụng...</strong>
            <span>Vui lòng chờ trong giây lát.</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.setTimeout(function () {
            const startupMarker = document.querySelector('[data-app-startup]');
            if (!startupMarker || !startupMarker.isConnected) {
                return;
            }

            startupMarker.classList.add('app-startup-failed');
            startupMarker.replaceChildren();

            const title = document.createElement('strong');
            title.textContent = 'Ứng dụng chưa thể khởi động';

            const message = document.createElement('span');
            message.textContent = 'Hãy đóng ứng dụng, mở lại và thử thêm một lần.';

            const errorCode = document.createElement('small');
            errorCode.textContent = 'Mã lỗi: APP-BOOT-001';

            startupMarker.append(title, message, errorCode);
        }, 12000);
    </script>

</body>

</html>
