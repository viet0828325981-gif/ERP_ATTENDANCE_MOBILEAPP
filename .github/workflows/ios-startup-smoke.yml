name: iOS startup smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-startup-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: vn.moon.tinhcong
  DOTNET_VERSION: 9.0.314
  DOTNET_WORKLOAD_SET: 9.0.314.3
  PROJECT_FILE: ERP_PAYROLLMOBILE.csproj

jobs:
  startup:
    name: Launch login screen in iOS Simulator
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app

      - name: Isolate conflicting .NET 10 workload manifests
        shell: bash
        run: |
          set -euo pipefail
          manifest_dir="${DOTNET_ROOT}/sdk-manifests/10.0.100"
          if [ -d "$manifest_dir" ]; then
            sudo mv "$manifest_dir" "${RUNNER_TEMP}/sdk-manifests-10.0.100"
          fi

      - name: Install .NET MAUI iOS workload
        run: dotnet workload install maui-ios --version "${DOTNET_WORKLOAD_SET}"

      - name: Restore iOS Simulator dependencies
        run: >-
          dotnet restore "${PROJECT_FILE}"
          -p:TargetFrameworks=net9.0-ios
          -p:TargetFramework=net9.0-ios
          -r iossimulator-arm64

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$PROJECT_FILE" \
            -f net9.0-ios \
            -c Release \
            -r iossimulator-arm64 \
            --no-restore \
            -p:TargetFrameworks=net9.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:ApplicationId="$APP_ID"

      - name: Launch app and verify login screen
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find "$GITHUB_WORKSPACE/bin/Release/net9.0-ios" -type d -name '*.app' -print -quit)"
          test -n "$app_path"

          device_id="$(xcrun simctl list devices available --json | jq -r '.devices[][] | select(.name | startswith("iPhone")) | .udid' | head -n 1)"
          test -n "$device_id"

          stdout_log="$RUNNER_TEMP/ios-app-stdout.log"
          stderr_log="$RUNNER_TEMP/ios-app-stderr.log"
          screenshot="$RUNNER_TEMP/ios-startup.png"

          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl launch \
            --terminate-running-process \
            --stdout="$stdout_log" \
            --stderr="$stderr_log" \
            "$device_id" "$APP_ID"

          login_rendered=false
          for _ in $(seq 1 45); do
            if grep -Fq "[AppStartup] Login screen rendered." "$stdout_log" "$stderr_log" 2>/dev/null; then
              login_rendered=true
              break
            fi
            sleep 1
          done

          xcrun simctl io "$device_id" screenshot "$screenshot"

          if [ "$login_rendered" != true ]; then
            echo "Login screen did not render within 45 seconds."
            printf '\n--- stdout ---\n'
            test ! -f "$stdout_log" || cat "$stdout_log"
            printf '\n--- stderr ---\n'
            test ! -f "$stderr_log" || cat "$stderr_log"
            exit 1
          fi

          echo "Login screen rendered successfully."

      - name: Shut down Simulator
        if: always()
        run: xcrun simctl shutdown all || true

      - name: Upload screenshot and app logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-startup-smoke-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ios-startup.png
            ${{ runner.temp }}/ios-app-stdout.log
            ${{ runner.temp }}/ios-app-stderr.log
          if-no-files-found: warn
          retention-days: 14
